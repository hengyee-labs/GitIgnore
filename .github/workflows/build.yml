name: Build GitIgnore

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: macOS Release build
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build unsigned Universal app
        run: |
          xcodebuild \
            -project GitIgnore.xcodeproj \
            -scheme GitIgnore \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GitIgnoreDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Universal binary
        run: |
          file "$RUNNER_TEMP/GitIgnoreDerivedData/Build/Products/Release/GitIgnore.app/Contents/MacOS/GitIgnore"
