name: Release GitIgnore

# Builds can be replayed for an existing tag from workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build unsigned public release
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$VERSION^{commit}")"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Universal app
        run: |
          APP_VERSION="${VERSION#v}"
          APP_VERSION="${APP_VERSION%%-*}"
          xcodebuild \
            -project GitIgnore.xcodeproj \
            -scheme GitIgnore \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GitIgnoreDerivedData" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build

      - name: Package ad-hoc signed app
        run: |
          APP="$RUNNER_TEMP/GitIgnoreDerivedData/Build/Products/Release/GitIgnore.app"
          ARCHIVE="GitIgnore-${VERSION}.zip"
          DMG="GitIgnore-${VERSION}.dmg"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo "$APP/Contents/MacOS/GitIgnore" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          DMG_ROOT=$(mktemp -d "$RUNNER_TEMP/GitIgnore-dmg.XXXXXX")
          ditto "$APP" "$DMG_ROOT/GitIgnore.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "GitIgnore ${VERSION}" -srcfolder "$DMG_ROOT" -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Preserve release packages
        uses: actions/upload-artifact@v4
        with:
          name: GitIgnore-${{ env.VERSION }}
          path: |
            GitIgnore-*.dmg
            GitIgnore-*.zip
            GitIgnore-*.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "GitIgnore-${VERSION}.zip" \
            "GitIgnore-${VERSION}.zip.sha256" \
            "GitIgnore-${VERSION}.dmg" \
            "GitIgnore-${VERSION}.dmg.sha256" \
            --title "GitIgnore ${VERSION}" \
            --verify-tag \
            --generate-notes
